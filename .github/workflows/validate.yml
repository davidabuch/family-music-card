name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check custom_components tests
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Check card syntax
        run: node --check custom_components/family_music/www/family-music-card.js
