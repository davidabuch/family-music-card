<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Music">
  <title>Family Music</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=0.2.51">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/approved-v2/icon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/icons/approved-v2/icon-16.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=approved-v2"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=approved-v2"></head>
<body>
  <main id="app" class="app-shell">
    <section id="nowView" class="view active">
      <div class="now-card">
        <div id="artwork" class="artwork"><span>♪</span></div>
        <div class="track-copy">
          <h1 id="trackTitle">Nothing playing</h1>
          <p id="trackMeta">—</p>
        </div>
        <div class="progress-wrap">
          <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Track progress">
          <div class="progress-time"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
        </div>
        <div class="transport">
          <button id="repeat" class="mode-button" aria-label="Repeat off" title="Repeat off" type="button">↻</button>
          <button id="previous" aria-label="Previous" type="button">|◀</button>
          <button id="playPause" class="primary" aria-label="Play or pause" type="button">▶</button>
          <button id="next" aria-label="Next" type="button">▶|</button>
          <button id="shuffle" class="mode-button" aria-label="Shuffle off" title="Shuffle off" type="button">⤨</button>
        </div>
        <div class="volume-row">
          <button id="volumeDown" class="nudge" aria-label="Volume down">−</button>
          <input id="volume" type="range" min="0" max="100" step="1" value="20" aria-label="Volume">
          <span id="volumeValue">20</span>
          <button id="volumeUp" class="nudge" aria-label="Volume up">＋</button>
        </div>
        <div class="bottom-actions">
          <button id="mute" class="mute-bottom-circle" type="button" aria-label="Mute" aria-pressed="false">🔊</button>
          <button id="openSearch" class="search-circle" aria-label="Search music">⌕</button>
          <button id="destination" class="destination-pill" aria-label="Choose playback destination"><span class="speaker-icon"><svg class="speaker-group-icon" viewBox="0 0 28 24" aria-hidden="true" focusable="false">
  <rect x="2.5" y="6.5" width="12" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="8.5" cy="16.2" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="12.5" y="2.5" width="12" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="18.5" cy="12.2" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/>
</svg></span><strong id="destinationName">Speaker</strong><span>⌃</span></button>
          <button id="more" class="more-circle" aria-label="Group speakers"><svg class="single-speaker-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect x="5" y="2.5" width="14" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="12" cy="14.5" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="12" cy="7.2" r="1.6" fill="currentColor"/>
</svg></button>
        </div>
      </div>
      <div id="overlay" class="overlay"></div>
    </section>

    <section id="favoritesView" class="view browser-view"><header><button class="back-now">‹</button><h2>Favorites</h2></header><div class="provider-row" aria-label="Filter favorites by service"><button class="favorite-provider active" data-favorite-provider="all" aria-pressed="true">All</button><button class="favorite-provider" data-favorite-provider="apple" aria-pressed="false">Apple Music</button><button class="favorite-provider" data-favorite-provider="spotify" aria-pressed="false">Spotify</button><button class="favorite-provider" data-favorite-provider="library" aria-pressed="false">Library</button><button class="favorite-provider" data-favorite-provider="sonos" aria-pressed="false">Sonos</button></div><div id="favoritesBody" class="content"></div></section>
    <section id="recentsView" class="view browser-view"><header><button class="back-now">‹</button><h2>Recently Played</h2></header><div id="recentsBody" class="content"></div></section>
    <section id="searchView" class="view browser-view">
      <header><button class="back-now" aria-label="Back to Now Playing">‹</button><h2>Search</h2></header>
      <div class="searchbar"><label class="sr-only" for="searchInput">Search artists, albums, songs, playlists or stations</label><input id="searchInput" type="search" enterkeyhint="search" autocomplete="off" placeholder="Artist, album, song, playlist or station…"><button id="voiceSearch" type="button" class="voice-search" aria-label="Search by voice" aria-pressed="false" title="Search by voice"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg></button><button id="searchButton" type="button">Search</button></div><p id="voiceStatus" class="sr-only" role="status" aria-live="polite"></p>
      <div class="provider-row"><button class="provider active" data-provider="all" aria-pressed="true">All</button><button class="provider" data-provider="apple" aria-pressed="false">Apple Music</button><button class="provider" data-provider="spotify" aria-pressed="false">Spotify</button></div>
      <div class="provider-row" aria-label="Search by music type"><button class="search-type" data-type="artists" aria-pressed="false">Artists</button><button class="search-type active" data-type="albums" aria-pressed="true">Albums</button><button class="search-type" data-type="songs" aria-pressed="false">Songs</button><button class="search-type" data-type="playlists" aria-pressed="false">Playlists</button><button class="search-type" data-type="radio" aria-pressed="false">Stations</button></div><div id="searchBody" class="content" aria-live="polite" aria-relevant="additions text"></div>
    </section>
    <nav class="tabbar" aria-label="Family Music">
      <button class="active" data-view="now"><span>⌂</span><small>Now</small></button>
      <button data-view="recents"><span>↶</span><small>Recents</small></button>
      <button data-view="favorites"><span>♥</span><small>Favorites</small></button>
      <button data-view="search"><span>⌕</span><small>Search</small></button>
    </nav>
    <details class="app-diagnostics"><summary>About &amp; diagnostics</summary>
      <p id="buildInfo">Loading version…</p><pre id="actionDiagnostics"></pre>
    </details>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="/app.js?v=0.2.51" defer></script>
</body>
</html>
