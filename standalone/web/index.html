<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0d0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Music">
  <title>Family Music</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=0.2.12">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="nowView" class="view active">
      <div class="now-card">
        <div id="artwork" class="artwork"><span>♪</span></div>
        <div class="track-copy">
          <h1 id="trackTitle">Nothing playing</h1>
          <p id="trackMeta">—</p>
        </div>
        <div class="progress-wrap">
          <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Track progress">
          <div class="progress-time"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
        </div>
        <div class="transport">
          <button id="shuffle" class="mode-button" aria-label="Shuffle" title="Shuffle">⇄</button>
          <button id="previous" aria-label="Previous">|◀</button>
          <button id="playPause" class="primary" aria-label="Play or pause">▶</button>
          <button id="next" aria-label="Next">▶|</button>
          <button id="repeat" class="mode-button" aria-label="Repeat" title="Repeat">↔</button>
        </div>
        <div class="volume-row">
          <button id="mute" class="icon-button" type="button" aria-label="Mute" aria-pressed="false">🔊</button>
          <button id="volumeDown" class="nudge" aria-label="Volume down">−</button>
          <input id="volume" type="range" min="0" max="100" step="1" value="20" aria-label="Volume">
          <span id="volumeValue">20</span>
          <button id="volumeUp" class="nudge" aria-label="Volume up">＋</button>
        </div>
        <div class="bottom-actions">
          <button id="openSearch" class="search-circle" aria-label="Search music">⌕</button>
          <button id="destination" class="destination-pill" aria-label="Choose playback destination"><span class="speaker-icon">▣</span><strong id="destinationName">Speaker</strong><span>⌃</span></button>
          <button id="more" class="more-circle" aria-label="Speaker balance">▣</button>
        </div>
      </div>
      <div id="overlay" class="overlay"></div>
    </section>

    <section id="favoritesView" class="view browser-view"><header><button class="back-now">‹</button><h2>Favorites</h2></header><div id="favoritesBody" class="content"></div></section>
    <section id="recentsView" class="view browser-view"><header><button class="back-now">‹</button><h2>Recently Played</h2></header><div id="recentsBody" class="content"></div></section>
    <section id="searchView" class="view browser-view">
      <header><button class="back-now">‹</button><h2>Search</h2></header>
      <div class="searchbar"><input id="searchInput" type="search" placeholder="Artist, album, song, playlist or station…"><button id="searchButton">Search</button></div>
      <div class="provider-row"><button class="provider active" data-provider="all">All</button><button class="provider" data-provider="apple">Apple Music</button><button class="provider" data-provider="spotify">Spotify</button></div>
      <div id="searchBody" class="content"></div>
    </section>
    <nav class="tabbar" aria-label="Family Music">
      <button class="active" data-view="now"><span>⌂</span><small>Now</small></button>
      <button data-view="recents"><span>↶</span><small>Recents</small></button>
      <button data-view="favorites"><span>♥</span><small>Favorites</small></button>
      <button data-view="search"><span>⌕</span><small>Search</small></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="/app.js?v=0.2.12" defer></script>
</body>
</html>
